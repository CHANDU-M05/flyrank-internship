version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgetplatform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
